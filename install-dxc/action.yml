name: "Install DXC"
description: "Install DXC"

inputs:
  dxc-release:
    type: string
    description: The version of DirectX Shader Compiler
    default: "v1.8.2505.1"
  dxc-filename:
    type: string
    description: The filename of DirectX Shader Compiler archive
    default: "dxc_2025_07_14.zip"

runs:
  using: "composite"
  steps:
    - name: Install DirectX
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -e

        curl.exe -fL --retry 3 --retry-all-errors --retry-max-time 900 \
                 --connect-timeout 20 --max-time 1800 --speed-limit 102400 --speed-time 30 \
                 https://github.com/microsoft/DirectXShaderCompiler/releases/download/${{ inputs.dxc-release }}/${{ inputs.dxc-filename }} -o dxc.zip
        7z.exe e dxc.zip -odxc bin/x64/{dxc.exe,dxcompiler.dll,dxil.dll}

        # We need to use cygpath to convert PWD to a windows path as we're using bash.
        cygpath --windows "$PWD/dxc" >> "$GITHUB_PATH"
